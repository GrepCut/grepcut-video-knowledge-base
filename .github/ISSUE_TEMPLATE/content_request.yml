name: Content request
description: Request a new page, translation, or copy change
title: "[REQUEST] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first to avoid duplicates.
  - type: dropdown
    id: page-type
    attributes:
      label: Page type
      options:
        - product
        - converter
        - tool
        - guide
        - translation
        - other
    validations:
      required: true
  - type: dropdown
    id: request-kind
    attributes:
      label: Kind of request
      options:
        - New page
        - Translation
        - Copy fix
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Locale
      placeholder: e.g. en, pl, de
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Proposed slug or existing path
      placeholder: e.g. converters/mov-to-mp4.md
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should be added or changed, and why. Do not invent product features.
    validations:
      required: true
